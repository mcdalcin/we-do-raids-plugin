/*
 * Standalone RuneLite Plugin Hub build for the We Do Raids plugin.
 * Mirrors the official runelite/example-plugin template.
 */
plugins {
    id 'java'
    id 'checkstyle'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.wedoraids.WeDoRaidsPluginTest'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

group = 'com.wedoraids'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs "-ea"
    args "--developer-mode", "--debug"
}

// Renders every side-panel state for visual review. Test-source only, so it never reaches the jar.
// `gradlew gallery` opens the window; `gradlew gallery --args="--capture 503"` writes PNGs instead.
tasks.register('gallery', JavaExec) {
    group = 'verification'
    description = 'Render every side-panel state for visual review.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wedoraids.gallery.DesignGallery'
}

checkstyle {
    toolVersion = '8.3'
    configDirectory = file('config/checkstyle')
}
